name: Validate Luvep integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/integrate-final-handover]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, curl, sqlite3, pdo_sqlite, zip, gd, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - name: Verify PDF worker build compatibility
        run: node --test tests/js/pdf-worker-build.test.mjs
      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run complete regression suite
        run: php -d memory_limit=1G vendor/bin/phpunit
      - name: Verify workspace interactions and installation
        run: |
          node tests/Frontend/brief-references.cjs
          node tests/Frontend/marketing-workflow-save.cjs
          node tests/Frontend/ghl-calendar.cjs
          node tests/Frontend/ghl-post-media.cjs
          node tests/Frontend/workspace-install.cjs
          node tests/Frontend/user-view.cjs
          node tests/Frontend/proposal-approval-confirmation.cjs
          node tests/Frontend/engagement-email-review.cjs
          node tests/Frontend/hr-return-link.cjs
          node tests/Frontend/portal-layout-navigation.cjs
          node tests/Frontend/client-conversation-errors.cjs
          node --test tests/Frontend/assessment-notes.cjs tests/js/task-comments.test.mjs tests/js/case-thread-replies.test.mjs tests/js/http-client-csrf.test.mjs tests/js/compose-message-panel.test.mjs
