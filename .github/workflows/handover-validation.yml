name: Validate Luvep integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/integrate-final-handover]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, curl, sqlite3, pdo_sqlite, zip, gd, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - name: Verify PDF worker build compatibility
        run: node --test tests/js/pdf-worker-build.test.mjs tests/js/critical-dependencies.test.mjs tests/js/vif-supplement.test.mjs tests/js/vif-supplement-editing.test.mjs tests/js/vif-client-refresh.test.mjs
      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run complete regression suite
        run: php -d memory_limit=1G vendor/bin/phpunit
      - name: Verify workspace interactions and installation
        run: |
          node tests/Frontend/accommodation-carousel.cjs
          node tests/Frontend/accommodation-tenant-link.cjs
          node tests/Frontend/accommodation-agreements.cjs
          node tests/Frontend/accommodation-move-in.cjs
